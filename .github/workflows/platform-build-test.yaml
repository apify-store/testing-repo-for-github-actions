name: PR -> Build devel and test

on:
    pull_request:
        branches: [ master ]

jobs:
    buildDevelAndTest:
        uses: apify/apify-test-tools/.github/workflows/public_pr-build-test.yaml@claude/zen-mayer-7md3vw
        secrets: 
            TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
            CONFIG_SECRETS: |
                {
                    "E2E_TEST_APIFY_TOKEN_DBYPODOIHUZABNQTR": "${{ secrets.E2E_TEST_APIFY_TOKEN_DBYPODOIHUZANQTR }}",
                    "APIFY_TOKEN_PARTNER": "${{ secrets.APIFY_TOKEN_PARTNER }}"
                }