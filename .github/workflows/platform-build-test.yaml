name: PR Test

on:
    pull_request:
        branches: [ master, main ]

jobs:
    buildDevelAndTest:
        name: Build Devel and Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - uses: oNaiPs/secrets-to-env-action@b64e0192bc4bd2ec0682dee8696470d4866577fa
              with:
                secrets: ${{ toJSON(secrets) }}

            - name: Cache base commit
              id: base_commit
              uses: actions/cache@v4
              with:
                path: ./base_commit.txt
                key: base_commit

            - name: Install dependencies
              run: npm install

            - name: Build
              id: build
              run: |
                  export base_commit=$(cat base_commit.txt)
                  actor_builds=$(npx public-actors-tools build --source-branch "origin/${{ github.head_ref }}" --target-branch "origin/${{ github.base_ref }}" $(test $base_commit && echo "--base-commit $base_commit" || echo ""))
                  echo "actor_builds=$actor_builds" | tee -a $GITHUB_OUTPUT
                  npx public-actors-tools get-latest-commit --source-branch "origin/${{ github.head_ref }}" --target-branch "origin/${{ github.base_ref }}" $(test $base_commit && echo "--base-commit $base_commit" || echo "") > ./base_commit.txt

            - name: Test
              run: |
                  export ACTOR_BUILDS='${{ steps.build.outputs.actor_builds }}'
                  export RUN_PLATFORM_TESTS=1
                  npx vitest ./test/platform --run
