name: Platform tests - Daily

on:
    schedule:
        # Runs at 00:00 UTC every day
        - cron: '0 0 * * *'

jobs:
    platformTestsCore:
        name: Build Devel and Test
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - uses: oNaiPs/secrets-to-env-action@b64e0192bc4bd2ec0682dee8696470d4866577fa
              with:
                secrets: ${{ toJSON(secrets) }}

            - name: Install dependencies
              run: npm install

            - name: Test
              run: |
                  export RUN_ALL_PLATFORM_TESTS=1
                  npx vitest ./test/platform --run --reporter=default --reporter=json --outputFile=./test-output.json
                  npx public-actors-tools report-tests --report-file ./test-output.json
