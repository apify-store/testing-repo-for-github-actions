name: Build latest - Test repo

on:
    push:
        branches: [ master, main ]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    buildLatest:
        name: Build latest - test repo
        if: |
          !contains(github.event.head_commit.message, '[skip ci]') &&
          !contains(github.event.head_commit.message, '[skip platform-test]')

        runs-on: 
            labels: beta
        steps:
            -   uses: actions/checkout@v4
                with:
                    fetch-depth: 2
            -   name: Build latest and report to slack
                env:
                    APIFY_TOKEN_LUKASKRIVKA: ${{ secrets.APIFY_TOKEN_LUKASKRIVKA }}
                    TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
                run: npm run gha:start:build
